apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: healio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
        - name: patient-service
          image: healio/patient-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: PORT
              value: "5002"
            - name: MONGO_PATIENT_URI
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: MONGO_PATIENT_URI
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: CLOUDINARY_API_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: healio
spec:
  selector:
    app: patient-service
  ports:
    - port: 5002
      targetPort: 5002
  clusterIP: None
