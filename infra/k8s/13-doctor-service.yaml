apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: healio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
        - name: doctor-service
          image: healio/doctor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4003
          env:
            - name: PORT
              value: "4003"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: MONGODB_URI_DOCTOR
---
apiVersion: v1
kind: Service
metadata:
  name: doctor-service
  namespace: healio
spec:
  selector:
    app: doctor-service
  ports:
    - port: 4003
      targetPort: 4003
  clusterIP: None