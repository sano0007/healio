apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: healio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: healio/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: MONGO_AUTH_URI
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: MONGO_AUTH_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: JWT_EXPIRES_IN
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: healio
spec:
  selector:
    app: auth-service
  ports:
    - port: 5001
      targetPort: 5001
  clusterIP: None
