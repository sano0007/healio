apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: healio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: healio/auth-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: MONGODB_URI_AUTH
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: healio
spec:
  selector:
    app: auth-service
  ports:
    - port: 4001
      targetPort: 4001
  clusterIP: None