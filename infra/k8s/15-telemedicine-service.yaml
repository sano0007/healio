apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemedicine-service
  namespace: healio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemedicine-service
  template:
    metadata:
      labels:
        app: telemedicine-service
    spec:
      containers:
        - name: telemedicine-service
          image: healio/telemedicine-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5005
          env:
            - name: PORT
              value: "5005"
            - name: VIDEO_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: VIDEO_PROVIDER
            - name: JITSI_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: JITSI_BASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: telemedicine-service
  namespace: healio
spec:
  selector:
    app: telemedicine-service
  ports:
    - port: 5005
      targetPort: 5005
  clusterIP: None
