apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: healio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: healio/ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5008
          env:
            - name: PORT
              value: "5008"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: GROQ_API_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: healio
spec:
  selector:
    app: ai-service
  ports:
    - port: 5008
      targetPort: 5008
  clusterIP: None
