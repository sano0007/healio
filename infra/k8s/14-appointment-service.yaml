apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: healio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
        - name: appointment-service
          image: healio/appointment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5004
          env:
            - name: PORT
              value: "5004"
            - name: MONGO_APPOINTMENT_URI
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: MONGO_APPOINTMENT_URI
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: healio
spec:
  selector:
    app: appointment-service
  ports:
    - port: 5004
      targetPort: 5004
  clusterIP: None
