apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: healio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: healio/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5007
          env:
            - name: PORT
              value: "5007"
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: SMTP_PORT
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: SMTP_FROM
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: SMTP_PASS
            - name: NOTIFY_LK_USER_ID
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: NOTIFY_LK_USER_ID
            - name: NOTIFY_LK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: NOTIFY_LK_API_KEY
            - name: NOTIFY_LK_SENDER_ID
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: NOTIFY_LK_SENDER_ID
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: healio
spec:
  selector:
    app: notification-service
  ports:
    - port: 5007
      targetPort: 5007
  clusterIP: None
