apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: healio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: healio/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: JWT_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: FRONTEND_URL
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: NEXT_PUBLIC_API_URL
            - name: AUTH_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: AUTH_SERVICE_HOST
            - name: AUTH_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: AUTH_SERVICE_PORT
            - name: PATIENT_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: PATIENT_SERVICE_HOST
            - name: PATIENT_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: PATIENT_SERVICE_PORT
            - name: DOCTOR_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: DOCTOR_SERVICE_HOST
            - name: DOCTOR_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: DOCTOR_SERVICE_PORT
            - name: APPOINTMENT_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: APPOINTMENT_SERVICE_HOST
            - name: APPOINTMENT_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: APPOINTMENT_SERVICE_PORT
            - name: TELEMEDICINE_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: TELEMEDICINE_SERVICE_HOST
            - name: TELEMEDICINE_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: TELEMEDICINE_SERVICE_PORT
            - name: PAYMENT_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: PAYMENT_SERVICE_HOST
            - name: PAYMENT_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: PAYMENT_SERVICE_PORT
            - name: NOTIFICATION_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: NOTIFICATION_SERVICE_HOST
            - name: NOTIFICATION_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: NOTIFICATION_SERVICE_PORT
            - name: AI_SERVICE_HOST
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: AI_SERVICE_HOST
            - name: AI_SERVICE_PORT
              valueFrom:
                configMapKeyRef:
                  name: healio-configmap
                  key: AI_SERVICE_PORT
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: healio-secrets
                  key: GROQ_API_KEY
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: healio
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3001
      targetPort: 3001
  type: LoadBalancer
